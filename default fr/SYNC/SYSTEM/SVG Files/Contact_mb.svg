  <g id="MB_haut_de_page" data-name="MB haut de page">
    <text id="body_text-2" data-name="body text" class="cls-2" transform="translate(30 106.325)"><tspan class="cls-5"><tspan x="0" y="0">Lorsque l&apos;utilisateur clique sur « envoi », </tspan></tspan><tspan class="cls-12"><tspan x="0" y="24">le message s&apos;ouvrira dans leur </tspan></tspan><tspan class="cls-12" x="0" y="48">programme de messagerie habituel</tspan><tspan class="cls-5" x="232.149" y="48">, </tspan><tspan class="cls-5"><tspan x="0" y="72">prêt à partir.</tspan></tspan><tspan class="cls-5" x="0" y="106">Le bénéfice de ce système est que </tspan><tspan class="cls-12" x="211.626" y="106">vous </tspan><tspan class="cls-12"><tspan x="0" y="130">êtes sûr d&apos;avoir la bonne adresse mail </tspan></tspan><tspan class="cls-12" x="0" y="154">du utilisateur</tspan><tspan class="cls-5" x="87.617" y="154" xml:space="preserve"> dès la réception du mail.</tspan><tspan class="cls-5"><tspan x="0" y="188">Les textes par défaut sont définis dans </tspan></tspan><tspan class="cls-12" x="0" y="212">Svija Cloud › Sections</tspan><tspan class="cls-5" x="136.965" y="212">.</tspan></text>
