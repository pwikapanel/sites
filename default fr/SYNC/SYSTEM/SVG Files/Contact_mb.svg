    <text id="body_text" data-name="body text" class="cls-1" transform="translate(30 893.935)"><tspan class="cls-3"><tspan x="0" y="0">Il existe un outil pour vous aider à </tspan></tspan><tspan class="cls-3"><tspan x="0" y="24">convertir les dimensions de vos champs </tspan></tspan><tspan class="cls-3"><tspan x="0" y="48">dans Illustrator en format CSS :</tspan></tspan><tspan class="cls-6"><tspan x="0" y="76">files.svija.love/formulaire</tspan></tspan></text>
