  <g id="OD_haut_de_page" data-name="OD haut de page">
    <text id="body_text" data-name="body text" class="cls-2" transform="translate(119.1 289.325)"><tspan class="cls-6" x="0" y="0">Lorsque l&apos;utilisateur clique sur « envoi », </tspan><tspan class="cls-20" x="242.859" y="0">le message s&apos;ouvrira dans </tspan><tspan class="cls-20" x="0" y="24">leur programme de messagerie habituel</tspan><tspan class="cls-6" x="261.603" y="24">, prêt à partir.</tspan><tspan class="cls-6" x="0" y="58">Le bénéfice de ce système est que </tspan><tspan class="cls-20" x="211.626" y="58">vous êtes sûr d&apos;avoir la bonne </tspan><tspan class="cls-20" x="0" y="82">adresse mail du utilisateur</tspan><tspan class="cls-6" x="173.633" y="82" xml:space="preserve"> dès la réception de son mail.</tspan><tspan class="cls-6" x="0" y="116">Les textes par défaut sont définis dans </tspan><tspan class="cls-20" x="237.632" y="116">Svija Cloud › Sections</tspan><tspan class="cls-6" x="374.598" y="116">.</tspan></text>
    <text id="body_text-2" data-name="body text" class="cls-1" transform="translate(119.1 473.637)"><tspan class="cls-3"><tspan x="0" y="0">Il existe un outil pour vous aider à convertir les dimensions de vos </tspan></tspan><tspan class="cls-3"><tspan x="0" y="24">champs dans Illustrator en format CSS :</tspan></tspan><tspan class="cls-12"><tspan x="0" y="52">files.svija.love/formulaire</tspan></tspan></text>
    <text id="headline" class="cls-23" transform="translate(119 256.553)"><tspan x="0" y="0">NOUS CONTACTER</tspan></text>
